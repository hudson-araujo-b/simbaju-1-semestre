<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>SGAP – Protótipo de layout</title>
        <link rel="stylesheet" href="./css/login.css" />
    </head>
    <body>
        <div id="login">
            <div class="marca">
                <div class="simbolo-marca" aria-hidden="true">
                    <div class="cruz"></div>
                    <div class="losango"></div>
                    <div class="circulo"></div>
                </div>
                <h1>SGAP</h1>
                <p class="subtitulo">
                    Sistema de Gerenciamento e
                    <br />
                    Apoio à Triagem
                </p>
                <div class="faixa"></div>
                <p class="localizacao">UPA Franco da Rocha</p>
                <div class="mensagem">
                    <span class="coracao">♡</span>
                    <span>
                        Mais organização,
                        <br />
                        mais agilidade no atendimento.
                    </span>
                </div>
            </div>
            <div class="cartao-login">
                <h2>Bem-vindo ao SGAP</h2>
                <p class="introducao">
                    Faça o login para acessar o sistema de
                    <br />
                    triagem da UPA.
                </p>
                <label for="usuario">&nbsp; Usuário</label>
                <input id="usuario" value="Marina" placeholder="Digite seu usuário" />
                <label for="senha">&nbsp; Senha</label>
                <input id="senha" type="password" value="123456" placeholder="Digite sua senha" />
                <label for="perfil">
                    &nbsp; Perfil
                </label>
                <select id="perfil">
                    <option value="enf">Selecione seu perfil</option>
                    <option value="enf">Enfermeiro(a)</option>
                    <option value="coord">Coordenação</option>
                </select>
                <p><a class="botao-entrar" href="./html/pagina-inicial.html">⇥ &nbsp; Entrar</a></p>
                <div class="aviso-login">
                    <span class="icone-info">i</span>
                    <p class="nota">
                        O sistema sugere a classificação.
                        <br />
                        A validação é do profissional.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
